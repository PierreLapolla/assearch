services:
  api:
    build: ./backend
    container_name: assearch-api
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn", "assearch.main:app"]
    command: ["--reload", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: oven/bun:1-alpine
    container_name: assearch-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: 0.0.0.0
    command: sh -c "bun install --frozen-lockfile && bun dev --hostname 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: assearch-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  elasticsearch-data:
  frontend_modules:
